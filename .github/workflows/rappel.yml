name: Rappel de match

# GitHub retarde souvent les tâches planifiées (parfois de plusieurs heures) :
# on passe toutes les 30 min entre midi et la nuit, le script n'envoie qu'une fois par match.
# Pour un rappel à 12h45 pile, un service externe (cron-job.org) peut lancer ce workflow.
on:
  schedule:
    - cron: "15,45 10-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spurs-rappel
  cancel-in-progress: false

jobs:
  rappel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pywebpush

      - name: Rappel de match
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/notify.py

      - name: Mémoriser l'envoi
        run: |
          git add cache/notify_sent.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "spurs-bot"
          git config user.email "spurs-bot@users.noreply.github.com"
          git commit -m "Rappel envoyé"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
