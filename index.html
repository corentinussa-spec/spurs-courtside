<!doctype html>
<html lang="fr"><head>
<title>Spurs Courtside</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one column, app-like — sticky header + tab bar, cards stacked, match sheet slides over */
:root{
  --bg:#eef0f1; --surface:#ffffff; --surface2:#e3e6e8; --fg:#15181a; --muted:#5d666c; --line:#cfd5d9;
  --silver:#8a9599; --teal:#00808a; --pink:#c4246b; --orange:#d9661f;
  --win:#1f7a4a; --loss:#b3343a;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --data:"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --surface:#191d20; --surface2:#23292d; --fg:#e9edef; --muted:#97a2a8; --line:#2f373c;
  --silver:#a9b4b8; --teal:#2bb7c0; --pink:#ef5d99; --orange:#f08a4b; --win:#4cc483; --loss:#f0717a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#191d20; --surface2:#23292d; --fg:#e9edef; --muted:#97a2a8; --line:#2f373c;
  --silver:#a9b4b8; --teal:#2bb7c0; --pink:#ef5d99; --orange:#f08a4b; --win:#4cc483; --loss:#f0717a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:grid;gap:14px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:48px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;line-height:1;margin:0;text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
.fiesta{height:3px;background:linear-gradient(90deg,var(--teal) 0 33%,var(--pink) 33% 66%,var(--orange) 66%);margin-top:10px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:12px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
button:focus-visible,.row:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.03em;margin:6px 0 0;text-wrap:balance}
.label{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* next game hero */
.hero{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:18px 16px;display:grid;gap:12px;cursor:pointer;border:0;text-align:left;font:inherit;width:100%}
.hero .label{color:inherit;opacity:.7}
.matchup{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tm{display:grid;gap:2px;min-width:0}
.tm .ab{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9}
.tm .nm{font-size:12px;opacity:.75}
.tm.r{text-align:right}
.vs{font-family:var(--display);font-size:18px;opacity:.6}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clock{border:1px solid color-mix(in srgb,currentColor 25%,transparent);border-radius:8px;padding:8px 10px}
.clock .t{font-family:var(--data);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;opacity:.8;text-transform:capitalize}
.count{font-family:var(--data);font-size:13px;opacity:.8}
/* list rows */
.list{display:grid}
.month{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-bottom-width:0;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.row:first-of-type{border-radius:var(--r) var(--r) 0 0}
.month + .row{border-radius:var(--r) var(--r) 0 0}
.row.last{border-bottom-width:1px;border-radius:0 0 var(--r) var(--r)}
.row.only{border-radius:var(--r);border-bottom-width:1px}
.row .dt{font-family:var(--data);line-height:1.1}
.row .dt b{font-size:20px;display:block}
.row .dt span{font-size:11px;color:var(--muted);text-transform:uppercase}
.row .op{min-width:0}
.row .op .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .op .s{font-size:12px;color:var(--muted)}
.chip{font:600 11px var(--data);letter-spacing:.05em;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.w{background:color-mix(in srgb,var(--win) 16%,transparent);color:var(--win)}
.chip.l{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.chip.hide{background:color-mix(in srgb,var(--pink) 14%,transparent);color:var(--pink)}
.chip.next{background:var(--teal);color:var(--surface)}
.seg{display:flex;gap:6px}
.seg button{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--data);font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
td:first-child{background:var(--surface)}
tr:last-child td{border-bottom:0}
tr.sas td{font-weight:600;background:color-mix(in srgb,var(--teal) 10%,var(--surface))}
tr.cut td{border-bottom:2px dashed var(--silver)}
/* compare bars */
.cmp{display:grid;gap:10px}
.cmp .ln{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.cmp .ln .v{font-family:var(--data);font-weight:600;font-variant-numeric:tabular-nums}
.cmp .ln .v.r{text-align:right}
.cmp .k{font-size:12px;color:var(--muted);text-align:center;grid-column:1/-1;margin-bottom:-6px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;background:var(--fg)}
.bar i+i{background:var(--silver)}
/* spoiler */
.veil{display:grid;gap:10px;justify-items:start;border:1px dashed var(--pink);border-radius:var(--r);padding:14px;background:color-mix(in srgb,var(--pink) 6%,var(--surface))}
.veil p{margin:0}
.btn{font:600 13px var(--body);letter-spacing:.04em;border:0;border-radius:8px;padding:10px 14px;background:var(--fg);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .bar-top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet .bar-top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.score{display:flex;justify-content:center;align-items:baseline;gap:18px;font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.score small{font-size:16px;opacity:.6;font-family:var(--body);font-weight:600}
.records{display:grid;gap:8px}
.rec{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--orange) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 40%,transparent)}
.rec b{font-family:var(--display);font-size:22px;color:var(--orange);line-height:1}
.inj{display:grid;gap:8px}
.inj .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-left:4px solid var(--silver);background:var(--surface);border-radius:0 8px 8px 0}
.inj .it.out{border-left-color:var(--loss)}
.inj .it.q{border-left-color:var(--orange)}
.inj .it .d{grid-column:1/-1;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.stat .v{font-family:var(--data);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.notif{display:grid;gap:8px}.notif .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.notif .ok{color:var(--win);font-weight:600}

/* effectif */
.roster{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 40px 40px;gap:6px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .no{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.prow .nm{font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .v{text-align:right;font-family:var(--data);font-variant-numeric:tabular-nums;font-size:16px}
.prow .v.b{font-weight:600}
.phead{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 40px 40px;gap:6px;padding:0 12px 6px}
.phead span{font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.phead span:nth-child(n+3){text-align:right}
.pchip{display:inline-block;margin-top:2px;padding:2px 7px;border-radius:999px;font:600 11px var(--data);background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pchip.out{background:color-mix(in srgb,var(--loss) 16%,transparent);color:var(--loss)}
.pchip.ok{background:color-mix(in srgb,var(--win) 18%,transparent);color:var(--win)}
.phero{position:relative;background:#15181a;color:#eef0f1;overflow:hidden;display:flex;align-items:flex-end;gap:12px;min-height:200px;padding:20px 0 0 max(16px,env(safe-area-inset-left,0px))}
.phero .bign{position:absolute;left:46%;top:-34px;font-family:var(--display);font-weight:800;font-size:220px;line-height:1;color:#23292d;pointer-events:none}
.phero .who{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-bottom:18px}
.phero .who .label{color:#a9b4b8}
.phero .who h3{margin:0;font-family:var(--display);font-weight:800;font-size:42px;line-height:.95;text-transform:uppercase;text-wrap:balance}
.phero .ph{position:relative;width:132px;height:170px;flex:none;margin-right:max(16px,env(safe-area-inset-right,0px));border-radius:12px 12px 0 0;overflow:hidden;background:#2a3136;display:flex;align-items:flex-end;justify-content:center}
.phero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.pmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-bottom:1px solid var(--line)}
.pmeta div{padding:12px 10px;border-right:1px solid var(--line)}
.pmeta div:last-child{border-right:0}
.pmeta b{display:block;font-family:var(--data);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.pmeta span{font-size:11px;color:var(--muted)}
.gline{display:grid;gap:14px}
.gline .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gline .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.gline .big{font-family:var(--data);font-weight:600;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.gline .mid{font-family:var(--data);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.gline small{display:block;font-size:11px;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shots div{padding:8px 10px;border-radius:8px;background:var(--surface2)}
.shots b{font-family:var(--data);font-weight:600;font-size:16px}
.pbar{display:grid;grid-template-columns:70px minmax(0,1fr) 56px;gap:8px;align-items:center}
.pbar .tr{height:8px;border-radius:4px;background:var(--surface2);display:flex}
.pbar .tr i{display:block;border-radius:4px;background:var(--fg)}
.pbar b{text-align:right;font-family:var(--data);font-weight:600}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shead h2{margin:0}
.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head><body>

<header class="top"><div class="in">
  <div class="brand">

      <path d="M31 4 L22 5 Q23 26 11 36 L11 92 L77 92 L77 36 Q65 26 66 5 L57 4 Q55 24 44 24 Q33 24 31 4 Z" fill="#141414" stroke="#9aa5a9" stroke-width="3"/>
      <path d="M32 7 Q35 20 44 20 Q53 20 56 7" fill="none" stroke="#c9d1d4" stroke-width="2.5"/>

    </svg>
    <div><h1>Spurs Courtside</h1><div class="sub" id="upd">Chargement des données…</div></div>

  <nav class="tabs" role="tablist">

</div></header>

<main class="wrap" id="main">
  <div class="empty" id="boot">Les matchs, classements et stats apparaissent ici dès que la base est chargée.</div>
</main>
<div class="sheet" id="sheet" hidden></div>

<script>
const TEAMS={ATL:["Atlanta Hawks","E"],BOS:["Boston Celtics","E"],BKN:["Brooklyn Nets","E"],CHA:["Charlotte Hornets","E"],CHI:["Chicago Bulls","E"],CLE:["Cleveland Cavaliers","E"],DAL:["Dallas Mavericks","W"],DEN:["Denver Nuggets","W"],DET:["Detroit Pistons","E"],GSW:["Golden State Warriors","W"],HOU:["Houston Rockets","W"],IND:["Indiana Pacers","E"],LAC:["LA Clippers","W"],LAL:["Los Angeles Lakers","W"],MEM:["Memphis Grizzlies","W"],MIA:["Miami Heat","E"],MIL:["Milwaukee Bucks","E"],MIN:["Minnesota Timberwolves","W"],NOP:["New Orleans Pelicans","W"],NYK:["New York Knicks","E"],OKC:["Oklahoma City Thunder","W"],ORL:["Orlando Magic","E"],PHI:["Philadelphia 76ers","E"],PHX:["Phoenix Suns","W"],POR:["Portland Trail Blazers","W"],SAC:["Sacramento Kings","W"],SAS:["San Antonio Spurs","W"],TOR:["Toronto Raptors","E"],UTA:["Utah Jazz","W"],WAS:["Washington Wizards","E"]};
const S={roster:[],pgames:{},cbest:{},psort:"pts",openP:null,games:[],meta:null,standings:null,injuries:null,teams:{},players:{},watched:new Set(),tab:"matchs",filter:"avenir",conf:"W",open:null};

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name=a=>TEAMS[a]?.[0]||a;
const fmt=(d,tz,o)=>new Intl.DateTimeFormat("fr-FR",{timeZone:tz,...o}).format(d);
const tET=d=>new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"}).format(d);
const tCT=d=>new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"}).format(d);
const dUS=d=>new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric"}).format(d);
const tFR=d=>fmt(d,"Europe/Paris",{hour:"2-digit",minute:"2-digit"});
const dFR=d=>fmt(d,"Europe/Paris",{weekday:"long",day:"numeric",month:"long"});
const pct=(m,a)=>a?((100*m/a).toFixed(1)):"–";
const n1=v=>v==null?"–":(Math.round(v*10)/10).toFixed(1);

/* ---------- spoiler logic ---------- */
const SPOIL_MS=96*3600e3;
function isFinal(g){return g.status==="final"}
function locked(g){return isFinal(g)&&!S.watched.has(g.id)&&(Date.now()-new Date(g.start).getTime()<SPOIL_MS)}
function lockedGames(){return S.games.filter(locked)}
function anyLock(){return lockedGames().length>0}
async function markWatched(ids){
  ids.forEach(i=>S.watched.add(i));
  try{localStorage.setItem("spurs_watched",JSON.stringify([...S.watched]))}catch(e){}
  render(); if(S.open) openGame(S.open,true); else if(S.openP) openPlayer(S.openP,true);
}
function veil(text){
  const L=lockedGames(); const g=L[L.length-1];
  return `<div class="veil"><span class="label">Anti-spoiler</span><p>${esc(text)}</p>
  <button class="btn" data-watch="${L.map(x=>x.id).join(",")}">J'ai vu ${L.length>1?"les matchs":"le match contre "+esc(name(g.opp).split(" ").pop())}</button></div>`;
}

/* ---------- derived ---------- */
function sorted(){return [...S.games].sort((a,b)=>a.start.localeCompare(b.start))}
function nextGame(){const now=Date.now();return sorted().find(g=>!isFinal(g)&&new Date(g.start).getTime()>now-3*3600e3)}
function res(g){if(!isFinal(g)||!g.score)return null;return g.score.SAS>g.score.OPP?"V":"D"}
function h2h(opp){const L=sorted().filter(g=>g.opp===opp&&isFinal(g));let w=0,l=0;L.forEach(g=>res(g)==="V"?w++:l++);return {w,l,games:L}}
function record(abbr){
  if(abbr==="SAS"&&S.teams.SAS) return S.teams.SAS;
  const st=S.standings; if(st){for(const c of ["west","east"]){const r=(st[c]||[]).find(x=>x.abbr===abbr); if(r) return {...(S.teams[abbr]||{}),w:r.w,l:r.l}}}
  return S.teams[abbr]||{w:0,l:0};
}

/* ---------- views ---------- */
function vMatchs(){
  const ng=nextGame(); let h="";
  if(ng){const d=new Date(ng.start);const ms=d-Date.now();const hh=Math.floor(ms/3600e3),dd=Math.floor(hh/24);
    const cd=ms<=0?"En cours":dd>0?`Dans ${dd} j ${hh%24} h`:`Dans ${hh} h ${Math.floor(ms/60e3)%60} min`;
    h+=`<button class="hero" data-g="${ng.id}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="label">Prochain match · ${ng.home?"à domicile":"à l'extérieur"}</span><span class="count">${cd}</span></div>

const POS={PG:"Meneur",SG:"Arrière",G:"Arrière",SF:"Ailier",F:"Ailier",PF:"Ailier fort",C:"Pivot","G-F":"Arrière-ailier","F-G":"Ailier-arrière","F-C":"Ailier-pivot","C-F":"Pivot-ailier"};
const posFR=p=>POS[p]||p||"";
const fr1=v=>v==null||isNaN(v)?"–":(Math.round(v*10)/10).toFixed(1);
const pctFR=(m,a)=>a?(100*m/a).toFixed(1).replace(/\.0$/,"").replace(".",",")+" %":"–";
function rosterList(){
  if(S.roster.length) return S.roster;

function pid(r){return S.pgames[r.id]?r.id:(S.pgames[r.name]?r.name:r.id)}

function seasonAvg(rows){

  const o={gp:R.length}; ["min","pts","reb","ast","stl","blk","tov","fgm","fga","tpm","tpa","ftm","fta"].forEach(k=>o[k]=R.reduce((s,x)=>s+(x[k]||0),0));

}

function curve(rows){
  const R=rows.filter(played).slice(-10); if(R.length<2) return `<div class="empty">La courbe apparaît après deux matchs joués.</div>`;
  const vis=R.map(x=>!locked(S.games.find(g=>g.id===x.gid)||{}));
  const vals=R.filter((x,i)=>vis[i]).map(x=>x.pts); const mx=Math.max(30,Math.ceil((Math.max(0,...vals)+4)/10)*10);
  const X=i=>R.length===1?178:34+i*(288/(R.length-1)); const Y=v=>121-v/mx*90;
  const grid=[mx,mx*2/3,mx/3].map(v=>`<text x="0" y="${Y(v)+3}" font-size="10" fill="var(--muted)" font-family="Barlow Semi Condensed,sans-serif">${Math.round(v)}</text><line x1="18" y1="${Y(v)}" x2="340" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>`).join("");
  const pts=R.map((x,i)=>vis[i]?[X(i),Y(x.pts)]:null);
  const seg=pts.filter(Boolean).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const vp=pts.filter(Boolean); const area=vp.length>1?`<path d="${seg} L${vp[vp.length-1][0].toFixed(1)} 121 L${vp[0][0].toFixed(1)} 121 Z" fill="var(--teal)" fill-opacity=".1"/>`:"";
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  const marks=R.map((x,i)=>{const last=i===R.length-1;const ox=X(i);
    const lab=`<text x="${ox}" y="144" text-anchor="middle" font-size="9" font-family="Barlow,sans-serif" fill="${vis[i]?(last?"var(--fg)":"var(--muted)"):"var(--pink)"}" font-weight="${last?600:400}">${esc(x.opp||"")}</text>`;
    if(!vis[i]) return `<circle cx="${ox}" cy="${Y(mx/3)}" r="9" fill="none" stroke="var(--pink)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${ox}" y="${Y(mx/3)+4}" text-anchor="middle" font-size="12" font-weight="800" font-family="Big Shoulders Display,Impact,sans-serif" fill="var(--pink)">?</text>`+lab;
    const y=Y(x.pts);return `<circle cx="${ox}" cy="${y}" r="${last?5:3.5}" fill="var(--teal)"/><text x="${ox}" y="${y-(last?9:7)}" text-anchor="middle" font-size="${last?13:12}" font-weight="600" font-family="Barlow Semi Condensed,sans-serif" fill="${last?"var(--teal)":"var(--fg)"}">${x.pts}</text>`+lab}).join("");
  return `<div class="card" style="padding:12px 10px 8px"><svg width="100%" viewBox="0 0 340 152" role="img" aria-label="Points sur les derniers matchs">${grid}${avg!=null?`<line x1="18" y1="${Y(avg)}" x2="340" y2="${Y(avg)}" stroke="var(--teal)" stroke-dasharray="4 4" stroke-opacity=".6"/>`:""}${area}<path d="${seg}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round"/>${marks}</svg>
  <span class="muted" style="font-size:11px">${vis.every(Boolean)?`Pointillés : sa moyenne sur ces matchs (${fr1(avg).replace(".",",")}).`:"Le point du dernier match apparaît après ton replay."}</span></div>`;
}
function openPlayer(id,quiet){
  const r=rosterList().find(x=>x.id===id); if(!r) return; S.openP=id; S.open=null;
  const rows=prows(r); const fin=[...S.games].filter(isFinal).sort((a,b)=>a.start.localeCompare(b.start));
  const g1=fin[fin.length-1], g2=fin[fin.length-2]; const lock=anyLock();
  const line=g=>rows.find(x=>x.gid===g.id);
  const hIn=r.heightIn, wLb=r.weightLb;
  const meta=[[hIn?(hIn*0.0254).toFixed(2).replace(".",",")+" m":"–",hIn?`taille · ${Math.floor(hIn/12)}'${Math.round(hIn%12)}"`:"taille"],
    [wLb?Math.round(wLb*0.4536)+" kg":"–",wLb?`poids · ${Math.round(wLb)} lb`:"poids"],
    [r.age?r.age+" ans":"–","âge"],[r.exp!=null?(r.exp===0?"Rookie":(r.exp+1)+"e"):"–",r.exp===0?"1re saison":"saison NBA"]];
  let h=`<div class="bar-top"><div class="in"><button class="btn ghost" id="close">← Effectif</button></div></div>
  <div class="phero"><span class="bign" aria-hidden="true">${esc(r.jersey||"")}</span>
    <div class="who"><span class="label">${esc(posFR(r.pos))}${r.jersey?" · n° "+esc(r.jersey):""}</span><h3>${esc(r.name)}</h3><div>${injChip(r.name,true)}</div></div>
    <div class="ph"><svg width="120" height="150" viewBox="0 0 120 150" aria-hidden="true"><circle cx="60" cy="52" r="28" fill="#4a545a"/><path d="M10 150 Q14 96 60 92 Q106 96 110 150 Z" fill="#4a545a"/></svg>${r.photo?`<img src="${esc(r.photo)}" alt="Photo de ${esc(r.name)}" loading="lazy" onerror="this.remove()">`:""}</div></div>
  <div class="pmeta">${meta.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("")}</div><div class="wrap">`;
  if(g2){const L=gameLine(g2,line(g2));h+=`<div class="shead"><h2>Avant-dernier match</h2><span class="muted" style="font-size:12px">${L.lab}</span></div>${L.body()}`}
  if(g1){const L=gameLine(g1,line(g1));h+=`<div class="shead"><h2>Dernier match</h2><span class="muted" style="font-size:12px">${L.lab}</span></div>${L.body()}`}
  const a=seasonAvg(rows);
  h+=`<div class="shead"><h2>Saison</h2><span class="muted" style="font-size:12px">${lock?"masquée":a?`moyennes · ${a.gp} match${a.gp>1?"s":""}`:""}</span></div>`;
  if(lock) h+=`<div class="empty">Les moyennes de la saison incluent le dernier match : elles s'affichent dès que tu l'as vu.</div>`;
  else if(!a) h+=`<div class="empty">Pas encore de match joué cette saison.</div>`;
  else{const v=k=>fr1(a[k]/a.gp);const bar=(lab,m,t)=>{const p=t?100*m/t:0;return `<div class="pbar"><span class="muted" style="font-size:12px">${lab}</span><span class="tr"><i style="width:${p.toFixed(1)}%"></i></span><b>${t?p.toFixed(1).replace(".",",")+" %":"–"}</b></div>`};
    h+=`<div class="card gline"><div class="g3"><div><div class="big">${v("pts")}</div><small>points</small></div><div><div class="big">${v("reb")}</div><small>rebonds</small></div><div><div class="big">${v("ast")}</div><small>passes déc.</small></div></div>
    <div class="g4"><div><div class="mid">${v("min")}</div><small>minutes</small></div><div><div class="mid">${v("stl")}</div><small>interc.</small></div><div><div class="mid">${v("blk")}</div><small>contres</small></div><div><div class="mid">${v("tov")}</div><small>balles p.</small></div></div>
    <div style="display:grid;gap:8px">${bar("Tirs",a.fgm,a.fga)}${bar("À 3 pts",a.tpm,a.tpa)}${bar("Lancers",a.ftm,a.fta)}</div></div>`}
  h+=`<div class="label">Points · ${Math.min(10,rows.filter(played).length)||10} derniers matchs</div>${curve(rows)}`;
  const cb=S.cbest[r.id]; const vis=rows.filter(x=>!locked(S.games.find(g=>g.id===x.gid)||{}));
  const best=k=>Math.max(cb?cb[k]||0:0,...vis.map(x=>x[k]||0));
  h+=`<div class="label">Records en carrière${lock?" · avant ce match":""}</div><div class="grid2">${[["pts","points"],["reb","rebonds"],["ast","passes"]].map(([k,l])=>`<div class="stat"><div class="label">${l}</div><div class="v">${cb||vis.length?best(k):"–"}</div></div>`).join("")}</div></div>`;
  const sh=$("#sheet"); sh.innerHTML=h; sh.hidden=false; if(!quiet) sh.scrollTop=0;
  $("#close").onclick=()=>{sh.hidden=true;S.openP=null};
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t],[data-g],[data-f],[data-c],[data-watch],[data-p],[data-ps]"); if(!t) return;
  if(t.dataset.t){S.tab=t.dataset.t;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b===t));render();scrollTo(0,0)}
  else if(t.dataset.watch){markWatched(t.dataset.watch.split(","))}
  else if(t.dataset.g){openGame(t.dataset.g)}
  else if(t.dataset.f){S.filter=t.dataset.f;render()}
  else if(t.dataset.c){S.conf=t.dataset.c;render()}
  else if(t.dataset.p){openPlayer(t.dataset.p)}
  else if(t.dataset.ps){S.psort=t.dataset.ps;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden){$("#sheet").hidden=true;S.open=null;S.openP=null}});

/* ---------- data ---------- */
try{JSON.parse(localStorage.getItem("spurs_watched")||"[]").forEach(i=>S.watched.add(i))}catch(e){}
async function load(){
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});const j=await r.json();
    S.games=j.games||[];S.meta=j.meta;S.standings=j.standings;S.injuries=j.injuries;S.teams=j.teams||{};S.players=j.players||{};S.roster=j.roster||[];S.pgames=j.playerGames||{};S.cbest=j.careerBest||{};
    render();if(S.open)openGame(S.open,"noconf");else if(S.openP)openPlayer(S.openP,true)}
  catch(e){if(!S.games.length)$("#boot").textContent="Pas de connexion : les données s'afficheront dès que le téléphone sera en ligne."}
}
load();setInterval(load,15*60e3);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});

/* ---------- notifications push ---------- */
const VAPID="BBNXMzA6zlWE1cp-D9NegLVFzqd9CFoNnkNug2NFyny4RcyMKiC-dlhgLkSL3qCKR1xZLLTBxwZDe1ORigvmDGI";
const REPO="corentinussa-spec/spurs-courtside";
const N={state:"?",link:null,msg:""};
function b64u(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function hashStr(t){try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(d)].slice(0,6).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return String(Date.now())}}
async function ghLink(sub){const j=JSON.stringify(sub);const id=await hashStr(sub.endpoint);
  return `https://github.com/${REPO}/new/main/push?filename=${encodeURIComponent(id+".json")}&value=${encodeURIComponent(j)}`}
async function notifInit(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){N.state="unsupported";return render()}
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    let saved=false;try{saved=localStorage.getItem("spurs_push_saved")===(sub&&sub.endpoint)}catch(e){}
    N.state=sub?(saved?"on":"pending"):(Notification.permission==="denied"?"denied":"off");
    if(sub) N.link=await ghLink(sub.toJSON());}catch(e){N.state="off"}
  render();
}
async function notifEnable(){
  try{const perm=await Notification.requestPermission();
    if(perm!=="granted"){N.state="denied";return render()}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    N.link=await ghLink(sub.toJSON());N.state="pending";}
  catch(e){N.state="error";N.msg=String(e&&e.message||e)}
  render();
}
function notifCard(){
  if(N.state==="on") return `<div class="card notif"><div class="row2"><span class="ok">🔔 Rappel activé</span><span class="muted">sur ce téléphone, à 12h45 les jours de match.</span></div></div>`;
  if(N.state==="pending") return `<div class="card notif"><span class="label">Dernière étape</span><p style="margin:0">Enregistre ce téléphone sur GitHub pour recevoir le rappel : touche le bouton, puis <b>Commit changes</b> sur la page qui s'ouvre.</p>
    <div class="row2"><a class="btn" href="${esc(N.link)}" target="_blank" rel="noopener" id="ghsave">Enregistrer sur GitHub</a><button class="btn ghost" data-nd="1">C'est fait</button></div></div>`;
  if(N.state==="off"||N.state==="error") return `<div class="card notif"><span class="label">Rappel de match</span><p style="margin:0">Reçois une notification à 12h45 les jours de match. Aucun score n'y apparaît.</p>
    <div class="row2"><button class="btn" data-ne="1">Activer le rappel</button>${N.state==="error"?`<span class="muted">Échec : ${esc(N.msg)}</span>`:""}</div></div>`;
  if(N.state==="denied") return `<div class="card notif"><span class="label">Rappel de match</span><p style="margin:0" class="muted">Les notifications sont bloquées. Autorise-les dans Paramètres Android → Applis → Spurs → Notifications, puis rouvre l'appli.</p></div>`;
  return "";
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-ne]")) notifEnable();
  if(e.target.closest("[data-nd]")){navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).then(sub=>{try{localStorage.setItem("spurs_push_saved",sub.endpoint)}catch(e){}N.state="on";render()})}
});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").then(notifInit).catch(()=>{N.state="unsupported"})}
setInterval(()=>{if(S.tab==="matchs")render()},60000);
</script>
